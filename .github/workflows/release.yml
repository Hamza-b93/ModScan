name: Build & Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build binaries
        run: |
          npm run build:win
          npm run build:linux

      - name: Build AppImage
        run: npm run build:appimage

      - name: Set Snap version
        if: steps.tag_version.outputs.new_tag
        run: |
          VERSION="${{ steps.tag_version.outputs.new_tag }}"
          sed -i "s/^version: .*/version: '${VERSION#v}'/" snap/snapcraft.yaml

      - name: Build Snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Stage Snap artifact
        run: mv "${{ steps.snap.outputs.snap }}" dist/

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dist/ModScan-x86_64.flatpak
          manifest-path: packaging/io.github.hamza_b93.ModScan.yml

      - name: Create GitHub Release
        if: steps.tag_version.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: |
            dist/modscan-win.exe
            dist/modscan-linux
            dist/ModScan-x86_64.AppImage
            dist/*.snap
            dist/ModScan-x86_64.flatpak
